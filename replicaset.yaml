apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: <fill-in-name>            # e.g. frontend-rs
  labels:
    app: <fill-in-label>          # e.g. frontend
spec:
  replicas: 3                     # <-- change to match your lab's requirement
  selector:
    matchLabels:
      app: <fill-in-label>        # MUST match the pod template's labels below
  template:
    metadata:
      labels:
        app: <fill-in-label>      # MUST match selector.matchLabels above
    spec:
      containers:
        - name: <fill-in-container-name>   # e.g. nginx
          image: <fill-in-image>           # e.g. nginx:1.25
          ports:
            - containerPort: 80             # adjust to match your app
