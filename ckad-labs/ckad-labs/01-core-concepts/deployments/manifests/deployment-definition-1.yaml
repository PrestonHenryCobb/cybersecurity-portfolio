apiVersion: apps/v1
kind: Deployment                 # was lowercase "deployment" in the original file — fixed
metadata:
  name: deployment-1
spec:
  replicas: <fill-in>
  selector:
    matchLabels:
      app: <fill-in-label>       # must match template labels below
  template:
    metadata:
      labels:
        app: <fill-in-label>
    spec:
      containers:
        - name: <fill-in-container-name>
          image: <fill-in-image>
